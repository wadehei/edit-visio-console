name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: visual_builder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize database schema
        run: mysql -h 127.0.0.1 -P 3306 -u root < sql/init.sql

      # verify = 单元测试(test) + 集成测试(*IT, failsafe) + JaCoCo 覆盖率门禁(check)
      # it.* 系统属性由 surefire/failsafe 转发到 fork 出的测试 JVM，供 *IT 连接中间件。
      - name: Build & Verify
        run: >
          mvn -B -ntp verify
          -Dit.mysql.url=jdbc:mysql://127.0.0.1:3306/visual_builder
          -Dit.mysql.user=root
          -Dit.mysql.password=
          -Dit.redis.host=127.0.0.1
          -Dit.redis.port=6379
          -Dit.redis.password=

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
