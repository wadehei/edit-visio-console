server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev

  application:
    name: visual-builder-backend

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT（生产环境必须通过环境变量注入）
jwt:
  secret: ${JWT_SECRET:visual-builder-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  access-token-expire: 1800
  refresh-token-expire: 604800

# 文件存储（开发环境用 local，生产环境改为 minio）
storage:
  type: local
  local:
    base-path: ./uploads
    base-url: http://localhost:8080/uploads
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:visual-builder}

# 业务配置
business:
  page:
    max-version-count: 50
    autosave-interval: 30000
  resource:
    max-image-size: 10485760
    max-video-size: 104857600
    allowed-image-types: jpg,jpeg,png,gif,webp,svg
    allowed-video-types: mp4,webm

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.visualbuilder: debug
    org.springframework.security: info
