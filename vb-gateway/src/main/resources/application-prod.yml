spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/visual_builder?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  lifecycle:
    timeout-per-shutdown-phase: 30s

# 生产环境使用 MinIO
storage:
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:visual-builder}

jwt:
  secret: ${JWT_SECRET}

# CORS（生产环境从环境变量读取允许的 origin）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-domain.com}

# 生产环境禁用 Swagger
knife4j:
  enable: false

# 优雅停机
server:
  shutdown: graceful

logging:
  level:
    com.visualbuilder: info
    root: warn
